      software is open source and its contract shape is shared with every DSpace 8 install;
      the deployment, the content and the DOI prefix 10.82921 are Massey's.
    description: >-
      HAL/JSON REST API for Massey Research Online, running DSpace 8.3. Anonymous read is
      permitted on the repository root, communities (19 of them) and collections; item and
      bitstream listings return 401 "Authentication is required". Verified live 2026-09-01.
      The host is slow and intermittently drops connections to automated clients.
    humanURL: https://mro.massey.ac.nz/
