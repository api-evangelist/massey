  - aid: massey:idp-shibboleth
    name: Massey University Shibboleth Identity Provider
    x-operator: federation
    x-operator-evidence: >-
      entityID https://idp.massey.ac.nz/idp/shibboleth, shibmd:Scope massey.ac.nz, hosted on
      Massey's own idp.massey.ac.nz. Published in the Tuakiri Federation (New Zealand Access
      Federation) and in eduGAIN per the REFEDS Metadata Explorer Tool.
    description: >-
      Massey University's own SAML 2.0 / Shibboleth Identity Provider. The metadata document
      is public, machine-readable and continuously published to federation partners. It
      advertises SAML 2.0, SAML 1.1 and urn:mace:shibboleth:1.0, four SingleSignOnService
      bindings, four SingleLogoutService bindings and an AttributeAuthorityDescriptor. This
      is the institution's strongest machine-readable surface - it is operated by Massey, it
      is standards-conformant, and it is the surface a federated service provider actually
      integrates with.
    humanURL: https://met.refeds.org/met/entity/https%3A%2F%2Fidp.massey.ac.nz%2Fidp%2Fshibboleth/
    baseURL: https://idp.massey.ac.nz/idp/shibboleth
    tags: [ Identity Federation, Shibboleth, SAML, Tuakiri, eduGAIN, Single Sign-On ]
    properties:
      - type: Examples
        url: examples/massey-idp-metadata-summary.json
      - type: Authentication
        url: authentication/massey-authentication.yml
      - type: Conformance
        url: conformance/massey-conformance.yml
  - aid: massey:entra-id
    name: Massey University Microsoft Entra ID Tenant
    x-operator: federation
    x-operator-evidence: >-
      OIDC discovery by the institution's own domain, login.microsoftonline.com/massey.ac.nz,
      resolves to tenant 388728e1-bbd0-4378-98dc-f8682e644300. The tenant is Massey's; the
      platform is Microsoft's.
    description: >-
      Massey University's Microsoft Entra ID tenant, discoverable by domain. The OpenID
      Connect discovery document is public and machine-readable and gives the issuer,
      authorization, token and JWKS endpoints for Massey staff and student identities.
      Region scope OC (Oceania). Massey also runs masseyuni.sharepoint.com on the same
      tenant. Recorded as a relationship and an identity surface - the contract is
      Microsoft's, the tenant is Massey's.
    humanURL: https://www.massey.ac.nz/
    baseURL: https://login.microsoftonline.com/massey.ac.nz/v2.0/.well-known/openid-configuration
    tags: [ Identity Federation, OpenID Connect, OAuth, Entra ID, Single Sign-On ]
    properties:
      - type: Authentication
        url: authentication/massey-authentication.yml
  - aid: massey:datacite
    name: DataCite Membership — Massey University
    x-operator: registry
    x-operator-evidence: >-
      api.datacite.org is DataCite's own host and its contract is DataCite's. The MEMBERSHIP
      is a fact about Massey: provider id massey, symbol MASSEY, memberType
      consortium_organization under DataCite New Zealand (DOINZCO), rorId
      https://ror.org/052czxv31.
    description: >-
      Massey University is a DataCite member organization within the DataCite New Zealand
      consortium and mints DOIs through two active repositories - massey.eqpliw, "Pātaka
      Rangahau Massey Research Online" (prefix 10.82921, pointing at
      https://mro.massey.ac.nz/home), and massey.cgeajo, "Massey University Library Ebooks" /
      Open Educational Resources (prefix 10.82376, registered 2026). This corrects Massey's
      own research data guidance page, which still says the university does not subscribe to
      a DOI minting service at the university level. The registry's contract is DataCite's
      and is not saved here; only the membership is recorded.
    humanURL: https://commons.datacite.org/providers/massey
    baseURL: https://api.datacite.org/providers/massey
    tags: [ DataCite, DOI, Registry, Persistent Identifiers, Research Data ]
    properties:
      - type: Conformance
        url: conformance/massey-conformance.yml
  - aid: massey:crossref
    name: Crossref Membership — Massey University
    x-operator: registry
    x-operator-evidence: >-
      api.crossref.org is Crossref's own host. The membership is Massey's: member 12895
