    description: >-
      Massey University registers DOIs with Crossref under member id 12895, prefixes 10.33217
      and 10.54322, 314 DOIs recorded (22 current, 292 backfile). A second Massey member,
      22782, covers the Centre for Defence and Security Studies with prefix 10.36878 and 88
      DOIs. The registry's contract is Crossref's and is not saved here.
    humanURL: https://www.crossref.org/
    baseURL: https://api.crossref.org/members/12895
    tags: [ Crossref, DOI, Registry, Persistent Identifiers, Scholarly Publishing ]
    properties:
      - type: Conformance
        url: conformance/massey-conformance.yml
  - aid: massey:ror
    name: ROR Registration — Massey University
    x-operator: registry
    x-operator-evidence: >-
      ror.org is the Research Organization Registry's own host. The record is Massey's:
      https://ror.org/052czxv31, declaring domain massey.ac.nz, established 1927, types
      education and funder, GRID grid.148374.d, ISNI 0000 0001 0696 9806, Fundref 501100001554.
    description: >-
      Massey University's entry in the Research Organization Registry. This is the canonical
      machine-readable identifier for the institution and the anchor every other registry
      record in this profile points back to - DataCite's provider record carries the same ROR
      id. The registry's contract is ROR's and is not saved here.
    humanURL: https://ror.org/052czxv31
    baseURL: https://api.ror.org/v2/organizations/052czxv31
    tags: [ ROR, Registry, Persistent Identifiers, Organization Identifier ]
  - aid: massey:ebsco-discover
    name: Discover — EBSCO Discovery Service (Massey tenancy)
    x-operator: tenant
    x-operator-evidence: >-
      research.ebsco.com is EBSCO's generic host, shared by every EBSCO customer. The
      customer scope /c/4egzpd is Massey's and is the link Massey's own library pages send
      students to. The contract is EBSCO's; the tenancy is Massey's.
    description: >-
      "Discover" is Massey University Library's discovery layer, an EBSCO Discovery Service
      tenancy under customer scope 4egzpd, selected by the library in 2012. It searches the
      library catalogue and subscribed databases from one box. No institution-operated API
      sits in front of it and EBSCO's own contract is not saved here. The customer-scoped URL
      returned HTTP 400 to a bare automated request on 2026-09-01; the Massey page that
      publishes it is live.
    humanURL: https://www.massey.ac.nz/study/library/how-to-find-information-and-resources/using-discover-to-get-started/
    baseURL: https://research.ebsco.com/c/4egzpd/search
    tags: [ Library, Discovery, EBSCO, Vendor Platform, Tenant ]
  - aid: massey:libcal
    name: Massey Library Hours & Bookings — Springshare LibCal (Massey tenancy)
    x-operator: tenant
    x-operator-evidence: >-
      massey.libcal.com is an institution-specific subdomain CNAMEd to region-au.libcal.com,
      Springshare's Australian region host. The contract and the platform are Springshare's.
    description: >-
      Massey University Library's opening hours, room bookings and events run on a Springshare
      LibCal tenancy. LibCal exposes a REST API at /api/1.1/ which returned HTTP 403 without
      credentials on 2026-09-01 - a real, authenticated API surface, but Springshare's
      contract, not Massey's. Recorded as a tenancy.
    humanURL: https://massey.libcal.com/hours
    baseURL: https://massey.libcal.com/api/1.1
    tags: [ Library, Room Booking, Opening Hours, Springshare, Vendor Platform, Tenant ]
  - aid: massey:libanswers
    name: Massey Library Enquiries — Springshare LibAnswers (Massey tenancy)
    x-operator: tenant
    x-operator-evidence: >-
      massey.libanswers.com is an institution-specific subdomain on Springshare's LibAnswers
      platform.
    description: >-
      Massey University Library's public enquiry and FAQ service, running on a Springshare
      LibAnswers tenancy. Verified live 2026-09-01. Springshare's contract, Massey's tenancy
      and Massey's content.
    humanURL: https://massey.libanswers.com/
    tags: [ Library, Support, FAQ, Springshare, Vendor Platform, Tenant ]
