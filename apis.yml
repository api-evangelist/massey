---
aid: massey
name: Massey University
x-type: university
x-category: Public Research University
description: >-
  Massey University (Te Kunenga ki Pūrehuroa) is a public research university in New Zealand
  with campuses in Palmerston North (Manawatū), Wellington and Albany (Auckland). Its
  machine-readable footprint is real but small, and it is three different things at once.
  The university itself operates three callable surfaces: an OAI-PMH 2.0 endpoint and a
  DSpace 8.3 HAL/JSON REST API on its own host for Massey Research Online / Pātaka Rangahau,
  and the M-API, a news, events and staff-directory web service documented at
  www.massey.ac.nz/api/v1/ which is live and answering but API-key gated, self-described as
  unsupported, and closed to new key applications; the later M-API v1_2 host,
  api.massey.ac.nz, now states the service is no longer available. It operates two identity
  surfaces that are stronger than any of its APIs: a Shibboleth SAML 2.0 Identity Provider at
  idp.massey.ac.nz published through the Tuakiri Federation and eduGAIN, and a Microsoft
  Entra ID tenant discoverable by domain. And it is registered in three identifier
  registries - DataCite (as a DataCite New Zealand consortium organization with two
  repositories), Crossref (two members, three prefixes) and ROR. Everything else that looks
  like a Massey API is a vendor's: library discovery is EBSCO Discovery Service, opening
  hours and enquiries run on Springshare LibCal and LibAnswers. There is no central developer
  portal, no published API catalog, no llms.txt and no .well-known/apis.json.
