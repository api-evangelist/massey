  - aid: massey:mapi-v1
    name: Massey M-API WebService API v1
    x-operator: institution
    x-operator-evidence: >-
      Documented and served on www.massey.ac.nz, Massey's own domain, and described by the
      university as its own effort to surface Massey data for Massey websites and apps.
    description: >-
      Massey University's own news, events and staff-directory web service. A single endpoint,
      /api/v1/massey.cfc, selects a resource with a `path` parameter - news/articles,
      news/types, news/categories, events/events, events/types, events/categories or
      people/people - and filters with semicolon-separated `args` pairs. XML or JSON. Live
      and answering on 2026-09-01, but API-key gated with key applications not publicly
      available, and self-described by Massey as "a development experiment for DATA RETRIEVAL
      ONLY, not recommended for public consumption, is not supported, and may be discontinued
      without notice". Errors are returned in the body at HTTP 200, not as status codes. The
      successor host api.massey.ac.nz (v1_2) now states the service is no longer available.
    humanURL: https://www.massey.ac.nz/api/v1/
    baseURL: https://www.massey.ac.nz/api/v1/massey.cfc
