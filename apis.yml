apis:
  - aid: massey:mro-oai-pmh
    name: Massey Research Online OAI-PMH
    x-operator: institution
    x-operator-evidence: >-
      mro.massey.ac.nz is under Massey's own registrable domain; the Identify response names
      repositoryIdentifier mro.massey.ac.nz and adminEmail LibIT@massey.ac.nz.
    description: >-
      OAI-PMH 2.0 metadata-harvesting interface for Massey Research Online (Pātaka Rangahau),
      the university's DSpace institutional repository of theses, dissertations and research
      outputs. Fully anonymous, no key. Verified live 2026-09-01: protocolVersion 2.0,
      granularity YYYY-MM-DDThh:mm:ssZ, deletedRecord transient, identifier scheme
      oai:mro.massey.ac.nz. Thirteen metadata formats are offered - didl, mods, ore, mets,
      xoai, dim, rioxx, uketd_dc, qdc, oai_dc, rdf, marc and etdms.
    humanURL: https://mro.massey.ac.nz/
    baseURL: https://mro.massey.ac.nz/server/oai/request
    tags: [ OAI-PMH, Metadata Harvesting, Repository, Open Access, DSpace, Research ]
    properties:
