x-coverage:
  state: covered
  reason: covered
  detail: >-
    Three institution-operated surfaces were reached and read live on 2026-09-01: the OAI-PMH
    endpoint (Identify and ListMetadataFormats), the DSpace REST backend (root, communities
    and collections anonymous; items and bitstreams 401) and the M-API v1, whose keyless
    response proves the service is running. Two institution-operated identity surfaces were
    also read in full - the Shibboleth IdP metadata and the Entra ID OIDC discovery document.
    Registry memberships were confirmed directly from DataCite, Crossref and ROR. Three
    limits on this profile are worth stating. First, the M-API is API-key gated and Massey
    says key applications are not publicly available, so only its documented shape and its
    error behaviour could be recorded, never a successful data call. Second,
    mro.massey.ac.nz is genuinely slow and intermittently drops TLS connections - three
    consecutive fetches of the repository home page returned 000, 200 in 28s and 200 in 36s -
    so the discovery search endpoint is recorded from the HAL link index rather than from a
    confirmed 2xx. Third, royalsociety.org.nz returned 403 to every probe, so a probable New
    Zealand ORCID Consortium membership could not be evidenced and is deliberately not
    claimed. massey.figshare.com was tested and rejected: *.figshare.com is a wildcard, an
    invented control subdomain behaves identically, and Massey's own research data guidance
    points researchers at generic figshare.com. No Figshare tenancy is recorded.
